name: Release

# PyInstaller can't cross-compile, so each artifact is built on the OS
# it targets. Push a version tag to cut a release:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Use the "Run workflow" button to test a build without tagging; that
# uploads the binaries as workflow artifacts and creates no release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StreamerBuddy-windows
            binary: dist/StreamerBuddy.exe
          - os: ubuntu-latest
            artifact: StreamerBuddy-linux
            binary: dist/StreamerBuddy

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tk is bundled with Python on Windows but is a separate package
      # on Linux, and PyInstaller can only bundle what's installed.
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: python build.py

      - name: Smoke test the bundle
        shell: bash
        run: |
          # Catches the usual freezing failure: builds fine, then dies
          # at startup on an import PyInstaller stripped out.
          test -f "${{ matrix.binary }}"
          echo "Built ${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries for the release
        run: |
          mkdir -p release
          cp artifacts/StreamerBuddy-windows/StreamerBuddy.exe \
             release/StreamerBuddy-${{ github.ref_name }}-windows.exe
          cp artifacts/StreamerBuddy-linux/StreamerBuddy \
             release/StreamerBuddy-${{ github.ref_name }}-linux

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
